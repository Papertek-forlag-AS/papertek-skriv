<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Papertek Skriv</title>
    <meta name="description" content="Gratis skriveverksted for elever. Skriv, formater, eksporter til PDF.">
    <meta name="theme-color" content="#059669">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.svg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>

    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Leksihjelp scoped CSS (must come before any leksihjelp DOM renders) -->
    <link rel="stylesheet" href="/js/leksihjelp/styles/leksihjelp.css">

    <link rel="stylesheet" href="/css/main.css?v=74">

    <script>
        // Init theme early to prevent flash
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body class="skriv-leksihjelp bg-stone-50 dark:bg-stone-900 text-stone-900 dark:text-stone-200 antialiased">
    <!-- The .skriv-leksihjelp class scopes the vendored content.css. The -->
    <!-- spell-check renderer mounts #lexi-spell-overlay directly under -->
    <!-- <body>, so the wrapper has to live on <body>. The scoped CSS only -->
    <!-- targets leksihjelp-specific selectors (#lexi-*, .lh-*) so it -->
    <!-- doesn't bleed onto Skriv's own UI. -->
    <a href="#app" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-emerald-600 focus:text-white focus:px-4 focus:py-2 focus:rounded-lg focus:text-sm focus:font-semibold" id="skip-to-content">Hopp til innhold</a>
    <main id="app" role="main"></main>

    <!--
      Leksihjelp vendored bundle. Loaded as classic <script> tags BEFORE Skriv's
      ES module entry so that:
        1. The chrome.* shim (leksihjelp-loader.js) is in place before any
           vendored module touches chrome.runtime / chrome.storage.
        2. Each rule file's IIFE pushes its rule object onto __lexiSpellRules
           by the time spell-check-engine.js initialises (engine reads the
           array at construction time).
        3. window.__lexiVocab / __lexiSpellCore / __lexiI18n are published
           before the bridge in main.js calls bindBridge().
      Order below mirrors lockdown/public/js/leksihjelp-loader.js LEKSI_BUNDLE,
      with new rule files added in alphabetical order within each section.
      Re-sync regenerates this section if the file inventory changes.
    -->

    <script src="/js/leksihjelp-loader.js"></script>

    <!-- Foundation -->
    <script src="/js/leksihjelp/i18n/strings.js"></script>
    <script src="/js/leksihjelp/exam-registry.js"></script>
    <script src="/js/leksihjelp/content/vocab-seam-core.js"></script>
    <script src="/js/leksihjelp/content/vocab-seam.js"></script>
    <script src="/js/leksihjelp/content/spell-check-core.js"></script>

    <!-- Pre-pass infrastructure (priority 1-9) -->
    <script src="/js/leksihjelp/content/spell-rules/grammar-tables.js"></script>
    <script src="/js/leksihjelp/content/spell-rules/quotation-suppression.js"></script>
    <script src="/js/leksihjelp/content/spell-rules/redundancy.js"></script>
    <script src="/js/leksihjelp/content/spell-rules/register.js"></script>

    <!-- nb rules -->
    <script src="/js/leksihjelp/content/spell-rules/nb-propernoun-guard.js"></script>
    <script src="/js/leksihjelp/content/spell-rules/nb-codeswitch.js"></script>
    <script src="/js/leksihjelp/content/spell-rules/nb-dialect-mix.js"></script>

    <script src="/js/leksihjelp/content/spell-rules/nb-anglicism.js"></script>

    <script src="/js/leksihjelp/content/spell-rules/nb-gender.js"></script>
    <script src="/js/leksihjelp/content/spell-rules/nb-homophones.js"></script>
    <script src="/js/leksihjelp/content/spell-rules/nb-modal-verb.js"></script>
    <script src="/js/leksihjelp/content/spell-rules/nb-possessive-definite.js"></script>
    <script src="/js/leksihjelp/content/spell-rules/nb-riksmal-lexical.js"></script>

    <script src="/js/leksihjelp/content/spell-rules/universal-context-typo.js"></script>

    <!-- doc-drift post-pass (priority 80+) -->

    <script src="/js/leksihjelp/content/spell-rules/doc-drift-fr-address.js"></script>

    <!-- Lang detect must load before engines/renderers -->
    <script src="/js/leksihjelp/content/lang-detect.js"></script>

    <!-- Engines + renderers (engines BEFORE renderers — Phase 43 split) -->
    <script src="/js/leksihjelp/content/spell-check-engine.js"></script>
    <script src="/js/leksihjelp/content/spell-check-renderer.js"></script>

    <!-- Dictionary popup helpers -->
    <script src="/js/leksihjelp/popup/dict-state-builder.js"></script>
    <script src="/js/leksihjelp/popup/grammar-features-section.js"></script>

    <!-- Skriv app entry (must run AFTER leksihjelp bundle so the bridge can bindBridge) -->
    <script type="module" src="/js/app/main.js"></script>
</body>
</html>
