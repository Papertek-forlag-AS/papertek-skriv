<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="public/css/main.css">
    <style>
        #editor { padding: 2rem; width: 800px; }
    </style>
</head>
<body>
    <div id="editor">
        <figure class="skriv-image-block skriv-layout-side skriv-layout-dual-image skriv-valign-center" contenteditable="false">
            <div class="skriv-image-flex-container">
                <div class="skriv-image-wrapper">
                    <img src="https://via.placeholder.com/300x150" style="width: 100%;">
                    <figcaption class="skriv-image-caption">Short image</figcaption>
                </div>
                <div class="skriv-image-wrapper">
                    <img src="https://via.placeholder.com/300x500" style="width: 100%;">
                    <figcaption class="skriv-image-caption">Tall image</figcaption>
                </div>
            </div>
        </figure>
    </div>
</body>
</html>
